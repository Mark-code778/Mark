html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#000}

canvas{position:absolute;left:0;top:0}

.card{left:130px;width:560px;height:92px;border-radius:22px;background:rgba(28,32,42,.82);border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 40px rgba(0,0,0,.45);display:flex;align-items:center;gap:20px;padding:0 24px;box-sizing:border-box}

/* ingredients list */
.row{left:130px;display:flex;align-items:center;gap:26px}
.row .chip{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.12)}

#bigT{left:140px;top:290px;font-size:46px;color:#fff3df;letter-spacing:4px}
#bigS{left:140px;top:650px;font-size:40px;color:rgba(255,236,200,.8)}
#slogan{left:0;width:1920px;top:850px;text-align:center;font-size:74px;color:#fff3df;letter-spacing:2px;white-space:nowrap}
#slogan .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .18em}

#tag{left:0;width:1920px;top:960px;text-align:center;font-size:26px;letter-spacing:8px;color:rgba(255,214,140,.85)}
#flash{left:0;top:0;width:1920px;height:1080px;background:#fff;opacity:0;mix-blend-mode:screen}
#vig{left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}

#tvLine{left:0;top:538px;width:1920px;height:4px;background:#fff;box-shadow:0 0 30px 8px rgba(200,230,255,.8);opacity:0}
#black{left:0;top:0;width:1920px;height:1080px;background:#000;opacity:0}
#scan{left:0;top:0;width:1920px;height:1080px;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,0) 2px 5px)}
